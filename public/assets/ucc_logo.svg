<svg viewBox="0 0 500 500" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean White Rounded Background -->
  <rect width="500" height="500" rx="40" fill="#FFFFFF" />

  <!-- Mortarboard Flat Top -->
  <rect x="140" y="16" width="220" height="15" rx="3" fill="#F38B1C" />

  <!-- Mortarboard Head/Cap -->
  <path d="M192 31 H308 V72 C308 108 282 136 250 136 C218 136 192 108 192 72 Z" fill="#E32219" />

  <!-- Orange Brim Line on Cap -->
  <rect x="192" y="64" width="116" height="10" fill="#F38B1C" />

  <!-- Hanging Tassel Cord -->
  <rect x="326" y="31" width="10" height="55" fill="#F38B1C" />
  <!-- Tassel End -->
  <rect x="322" y="86" width="18" height="26" rx="2" fill="#F38B1C" />

  <!-- Neck Pillar -->
  <rect x="238" y="136" width="24" height="15" fill="#F38B1C" />

  <!-- Graduate Torso / Shoulders Silhouette -->
  <path d="M250 151 C172 151 130 180 130 220 C130 240 170 270 250 300 C330 270 370 240 370 220 C370 180 328 151 250 151 Z" fill="#E32219" />

  <!-- Radiating Book Pages (Left) -->
  <line x1="250" y1="300" x2="60" y2="225" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="48" y2="246" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="35" y2="267" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="22" y2="288" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="14" y2="309" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="10" y2="326" stroke="#E32219" stroke-width="7" stroke-linecap="round" />

  <!-- Radiating Book Pages (Right) -->
  <line x1="250" y1="300" x2="440" y2="225" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="452" y2="246" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="465" y2="267" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="478" y2="288" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="486" y2="309" stroke="#E32219" stroke-width="7" stroke-linecap="round" />
  <line x1="250" y1="300" x2="490" y2="326" stroke="#E32219" stroke-width="7" stroke-linecap="round" />

  <!-- Book Spine Base Bar with Center Spine Notch -->
  <path d="M10 339 H490 V371 H270 C270 384 262 393 250 393 C238 393 230 384 230 371 H10 Z" fill="#E32219" />

  <!-- Typography: UNIQUE -->
  <text x="250" y="445" text-anchor="middle" fill="#E32219" font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="82" letter-spacing="1">UNIQUE</text>

  <!-- Typography: COMMERCE CENTRE -->
  <text x="250" y="490" text-anchor="middle" fill="#E32219" font-family="'Montserrat', -apple-system, sans-serif" font-weight="800" font-size="39" letter-spacing="3.5">COMMERCE CENTRE</text>
</svg>
